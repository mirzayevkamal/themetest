name: Testing Ready

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: ["rebuild-testing"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing Ready
    runs-on: ${{ fromJSON(vars.RUNS_ON) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check twilight.json
        run: pnpm check:manifest

      - name: Build
        run: pnpm build

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
